name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - php: '8.2'
            testbench: '^10.0'
          - php: '8.4'
            testbench: '^10.0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
      - run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer test
